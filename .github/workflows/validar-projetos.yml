name: Validar dados

on:
  pull_request:
    paths:
      - "data/projetos.yml"
      - "data/mantenedores.yml"
      - "data/ranking-excluidos.yml"
      - "data/eventos.yml"
      - "data/comunidades.yml"
      - "src/content/artigos/**"
      - "scripts/validar-projetos.mjs"
      - "scripts/validar-mantenedores.mjs"
      - "scripts/gerar-ranking.mjs"
      - "scripts/validar-eventos.mjs"
      - "scripts/validar-comunidades.mjs"
      - "scripts/validar-artigos.mjs"
  push:
    branches: [main]
    paths:
      - "data/projetos.yml"
      - "data/mantenedores.yml"
      - "data/ranking-excluidos.yml"
      - "data/eventos.yml"
      - "data/comunidades.yml"
      - "src/content/artigos/**"
      - "scripts/validar-projetos.mjs"
      - "scripts/validar-mantenedores.mjs"
      - "scripts/gerar-ranking.mjs"
      - "scripts/validar-eventos.mjs"
      - "scripts/validar-comunidades.mjs"
      - "scripts/validar-artigos.mjs"

permissions:
  contents: read

jobs:
  validar:
    name: Validar projetos, mantenedores, ranking, eventos, comunidades e artigos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Validar projetos
        run: node scripts/validar-projetos.mjs --github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validar mantenedores
        if: ${{ !cancelled() }}
        run: node scripts/validar-mantenedores.mjs --github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validar exclusões do ranking
        if: ${{ !cancelled() }}
        run: node scripts/gerar-ranking.mjs --validar

      - name: Validar eventos
        if: ${{ !cancelled() }}
        run: node scripts/validar-eventos.mjs

      - name: Validar comunidades
        if: ${{ !cancelled() }}
        run: node scripts/validar-comunidades.mjs --github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validar artigos
        if: ${{ !cancelled() }}
        run: node scripts/validar-artigos.mjs --github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
