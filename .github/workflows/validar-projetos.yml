name: Validar dados

on:
  pull_request:
    paths:
      - "data/projetos.yml"
      - "data/mantenedores.yml"
      - "scripts/validar-projetos.mjs"
      - "scripts/validar-mantenedores.mjs"
  push:
    branches: [main]
    paths:
      - "data/projetos.yml"
      - "data/mantenedores.yml"
      - "scripts/validar-projetos.mjs"
      - "scripts/validar-mantenedores.mjs"

permissions:
  contents: read

jobs:
  validar:
    name: Validar projetos e mantenedores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Validar projetos
        run: node scripts/validar-projetos.mjs --github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validar mantenedores
        if: ${{ !cancelled() }}
        run: node scripts/validar-mantenedores.mjs --github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
