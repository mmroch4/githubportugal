name: Validar projetos

on:
  pull_request:
    paths:
      - "data/projetos.yml"
      - "scripts/validar-projetos.mjs"
  push:
    branches: [main]
    paths:
      - "data/projetos.yml"
      - "scripts/validar-projetos.mjs"

permissions:
  contents: read

jobs:
  validar:
    name: Validar data/projetos.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Validar formato e repositórios
        run: node scripts/validar-projetos.mjs --github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
