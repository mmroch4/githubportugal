# Agenda de eventos tech em Portugal
#
# Para adicionar um evento, acrescenta uma entrada à lista `eventos` e abre um
# pull request. Os eventos que já terminaram saem da agenda automaticamente e
# passam para a lista de eventos passados.
#
# Campos de cada evento:
#   nome       (obrigatório) nome do evento, por exemplo NDC Porto 2026
#   descricao  (obrigatório) uma frase em português de Portugal, até 200 caracteres
#   tipo       (obrigatório) um dos tipos listados abaixo
#   inicio     (obrigatório) data de início, no formato AAAA-MM-DD
#   fim        (opcional)    data de fim, se o evento durar mais de um dia
#   cidade     (obrigatório) cidade onde decorre; para eventos só online, escreve Online
#   formato    (opcional)    presencial (por omissão), online ou híbrido
#   gratuito   (opcional)    true se a entrada for gratuita
#   site       (obrigatório) página oficial do evento, começada por https://
#
# Instruções completas em CONTRIBUTING.md.

tipos:
  - Conferência
  - Meetup
  - Workshop
  - Hackathon

eventos:
