# Diretório de projetos open source portugueses
#
# Para adicionar um projeto, acrescenta uma entrada à lista `projetos` e abre um
# pull request. As estrelas, a linguagem e a data da última atividade são lidas
# automaticamente da API do GitHub, por isso não as escrevas aqui.
#
# Campos de cada projeto:
#   repositorio  (obrigatório) dono/nome do repositório no GitHub, por exemplo FogosPT/fogospt
#   descricao    (obrigatório) uma frase em português de Portugal, até 200 caracteres
#   categoria    (obrigatório) uma das categorias listadas abaixo
#   site         (opcional)    link para o site do projeto, começado por https://
#
# Instruções completas em CONTRIBUTING.md.

categorias:
  - Ferramentas de programação
  - Web
  - Mobile
  - Inteligência artificial e dados
  - Dados abertos
  - Serviço público
  - Multimédia
  - Comunidade e listas

projetos:
  - repositorio: pestphp/pest
    descricao: Framework de testes para PHP focado na simplicidade e numa sintaxe elegante.
    categoria: Ferramentas de programação
    site: https://pestphp.com

  - repositorio: nunomaduro/collision
    descricao: Mostra os erros de aplicações PHP de linha de comandos de forma clara e bonita.
    categoria: Ferramentas de programação

  - repositorio: nunomaduro/phpinsights
    descricao: Analisa a qualidade, a arquitetura e a complexidade do código PHP a partir do terminal.
    categoria: Ferramentas de programação
    site: https://phpinsights.com

  - repositorio: nunomaduro/termwind
    descricao: Permite estilizar o output de aplicações PHP de linha de comandos com classes ao estilo do Tailwind CSS.
    categoria: Ferramentas de programação

  - repositorio: larastan/larastan
    descricao: Extensão do PHPStan que encontra erros em aplicações Laravel sem as executar.
    categoria: Ferramentas de programação

  - repositorio: apocas/dockerode
    descricao: Cliente Node.js para a API do Docker, com suporte a streams e promessas.
    categoria: Ferramentas de programação

  - repositorio: Bartmr/not-me
    descricao: Biblioteca de validação de dados para TypeScript, igual no front-end e no back-end.
